# Promtail Configuration
# Scrapes Docker container logs and forwards to Loki
# Parses JSON structlog format for label extraction

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s

scrape_configs:
  # Docker container logs via Docker socket: one scrape job per service (hft-engine,
  # hft-monitor, redis), each restricted by a Docker API filter. The wal-loader and
  # clickhouse jobs below follow the same single-value form.
  #
  # Why the filter is in the Docker API and not in a relabel `keep`: on promtail 3.0.0 a
  # relabel `keep` does not stop docker_sd from tailing the container. It is still tailed,
  # with empty labels, and Loki rejects the whole batch (incident 2026-11-14). A container the
  # API filter does not return is never tailed at all.
  #
  # Why one job per service: Docker ANDs several values of one `label` filter, so a single
  # job listing several services would match nothing. Each job has exactly one value.
  #
  # Why the service label and not the compose project name: the production stack runs as
  # project `subhft`, and an earlier `com.docker.compose.project=hft_platform` filter matched
  # nothing there. Trade-off: a service-only filter matches a same-named service in ANY
  # compose project on the host.
  #
  # The relabel_configs and pipeline_stages are written once, under the hft-engine job
  # (anchors &docker_relabel and &docker_pipeline), and reused by alias in the other two jobs,
  # so the redaction cannot drift between jobs. To add a service, copy one of the later jobs
  # and change the job_name and the filter value.
  - job_name: hft-engine
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=hft-engine"]

    relabel_configs: &docker_relabel
      # Extract container name as label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Extract compose service name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # Set job label from service name
      - source_labels: ["service"]
        target_label: job
      # No `keep` rule: the Docker API filter on each job already restricts the containers.

    pipeline_stages: &docker_pipeline
      # Redact BEFORE anything is parsed, labelled or shipped to Loki. Some of what the
      # engine prints never passes through our own log scrubber: the Shioaji SDK's native
      # layer writes lines such as
      #   Response Code: 200 | Event Code: 18 | Info: #P2P/v:.../PYAPI/<account id>/1003/...
      # straight to stdout (fd 1) on session events (measured 2026-10-23: 1024 lines in one
      # hft-engine container, all on stdout). `python -m hft_platform.main` and `hft run` (live/sim)
      # now point fd 1 at /dev/null (HFT_SDK_STDOUT, utils/sdk_stdout.py); this stage stays as defence in depth. And
      # python-telegram-bot's HTTP client puts the bot token in a request URL. Neither can
      # be fixed in Python, so mask them here.
      #
      # STATUS (2026-11-24): all three docker jobs run this one pipeline through the
      # &docker_pipeline anchor, so each of them redacts before it parses. Before 2026-11-13 the
      # docker job's filter was `com.docker.compose.project=hft_platform`, which matched no
      # container on a host that runs the stack under another project name, so the hft-engine /
      # hft-bot / hft-monitor logs were NOT in Loki. These stages exist so that fixing the filter
      # does not start shipping the raw account id. The raw line stays in the host's `docker logs`
      # (json-file) until rotation drops it either way.
      #
      # Taiwan national ID shape: letter, 1 or 2, eight digits, not inside a longer token.
      - replace:
          expression: '(?:^|[^A-Za-z0-9])([A-Z][12][0-9]{8})(?:[^A-Za-z0-9]|$)'
          replace: '***ID***'
      # Telegram bot token: <8-11 digit bot id>:<30+ url-safe chars>
      - replace:
          expression: '(?:^|[^0-9])([0-9]{8,11}:[A-Za-z0-9_-]{30,})'
          replace: '***TELEGRAM_TOKEN***'

      # Parse JSON structlog output
      - json:
          expressions:
            level: level
            event: event
            module: module
            strategy: strategy
            symbol: symbol
            ts: timestamp
            error: error

      # Extract labels from parsed JSON
      - labels:
          level:
          module:

      # Map structlog levels to Loki-compatible levels
      - match:
          selector: '{job="hft-engine"}'
          stages:
            - regex:
                expression: '"level":"(?P<log_level>debug|info|warning|error|critical)"'
            - labels:
                log_level:

      # Drop debug logs in production to reduce volume
      - match:
          selector: '{log_level="debug"}'
          action: drop
          drop_counter_reason: debug_logs_dropped

      # Add timestamp from structlog ts field
      - timestamp:
          source: ts
          format: UnixMs
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
          action_on_failure: fudge

      # Structured metadata for high-cardinality fields (Loki 2.9+)
      - structured_metadata:
          strategy:
          symbol:
          error:

  - job_name: hft-monitor
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=hft-monitor"]

    relabel_configs: *docker_relabel

    pipeline_stages: *docker_pipeline

  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=redis"]

    relabel_configs: *docker_relabel

    pipeline_stages: *docker_pipeline

  # WAL loader logs (separate job)
  - job_name: wal-loader
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.service=wal-loader"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: job

    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            file: wal_file
            rows: rows_replayed

      - labels:
          level:

  # ClickHouse error logs
  - job_name: clickhouse
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.service=clickhouse"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: job

    pipeline_stages:
      # ClickHouse uses its own log format
      - regex:
          expression: '(?P<ch_timestamp>\d{4}\.\d{2}\.\d{2} \d{2}:\d{2}:\d{2}\.\d+) \[ \d+ \] \{[^}]*\} <(?P<ch_level>\w+)> (?P<ch_message>.*)'

      - labels:
          ch_level:

      # Only keep Warning and Error level CH logs
      - match:
          selector: '{ch_level=~"Trace|Debug|Information"}'
          action: drop
          drop_counter_reason: clickhouse_verbose_dropped
