groups:
- name: HFT_Critical
  rules:
  # ── Target Health ───────────────────────────────────────────────
  - alert: HFTEngineDown
    expr: up{job="hft-engine"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "HFT Engine scrape target is down"
      description: "hft-engine:9090 has been unreachable for >30s. The trading process may have crashed."

  # Feed Health
  - alert: FeedGapCritical
    expr: rate(feed_events_total[30s]) == 0 and market_trading_hours_active == 1
    for: 5s
    labels:
        severity: critical
    annotations:
        summary: "Market Data Gap Detected"
        description: "No feed events for >5s during uptime."
        runbook_url: "docs/runbooks/FeedGapCritical.md"

  - alert: FeedReconnectTimeoutDetected
    expr: increase(feed_reconnect_timeout_total[5m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Feed reconnect timeout detected"
        description: "Reconnect timed out at least once in the last 5m."

  - alert: FeedReconnectExceptionDetected
    expr: increase(feed_reconnect_exception_total[5m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Feed reconnect exception detected"
        description: "Reconnect raised exception at least once in the last 5m."

  - alert: SymbolConfigReloadFailed
    expr: increase(feed_symbol_config_reload_total{result!="ok"}[5m]) > 0
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Symbol reload preflight failed"
        description: |
          ShioajiClient._load_config() exited with result="{{ $labels.result }}"
          at least once in the last 5m. Symbol subscriptions are stale until
          the next successful reload (~25min cadence). RC-1 root cause:
          universe size > HFT_MAX_SUBSCRIPTIONS preflight ceiling. Check
          recent config/symbols.yaml diffs and ensure HFT_MAX_SUBSCRIPTIONS
          >= len(symbols).
        runbook_url: "docs/runbooks/SymbolConfigReloadFailed.md"

  - alert: FeedSubscriptionPermanentlyFailed
    expr: feed_subscription_permanent_failures_total > 0 and on() market_trading_hours_active == 1
    for: 15m
    labels:
        severity: warning
    annotations:
        summary: "Symbol subscription permanently failed (likely stale symbols.yaml after a contract roll)"
        description: |
          symbol="{{ $labels.symbol }}" crossed HFT_SUB_RETRY_MAX_ATTEMPTS and
          stopped retrying. Most common cause: config/symbols.yaml lists an
          expired month code (e.g. TXFE6 after the May settlement) that the
          broker has dropped, so subscribe returns "Contract not found".
          Pool-mode engines do NOT auto-rebuild symbols.yaml — regenerate it
          offline (make rebuild-symbols-yaml) and restart the engine.
        runbook_url: "docs/runbooks/SymbolsYamlRegeneration.md"

  # Feed timestamp skew. `feed_time_skew_ns` is clamped at HFT_TS_MAX_LAG_S
  # on the data path, so alert on the severity counter, which carries the raw
  # magnitude, not on the gauge.
  #
  # Two exclusions, both measured on THESHOW 2026-08-24, and both there because
  # the rule as first written fired only at session boundaries and never once
  # from steady-state market data:
  #
  # 1. topic="snapshot" is excluded outright. A snapshot's exch_ts is the
  #    contract's *last trade* time, so for an illiquid option it is legitimately
  #    hours or days old and says nothing about feed health. The counter stood at
  #    exactly 478 -- one per subscription (120/120/119/119) -- having jumped
  #    0 -> 458 -> 478 during the 22:16 CST subscribe burst and then stayed
  #    perfectly flat for the following 22 h. The earlier note here read those
  #    crossings as an unalerted problem; they are one crossing per contract at
  #    subscribe time.
  # 2. The whole rule is gated on market_trading_hours_active, as
  #    EventLoopLagHigh and AlphaSignalSilent already are. Every bidask/tick
  #    crossing in 36 h fell in a between-sessions window (08:31 and 08:46 CST
  #    around the 08:47 open, 14:26-14:56 CST inside the 13:47-15:02 close), where
  #    the first quote after a gap is stale by construction. The bursts are too
  #    large to separate by magnitude (up to 126 per 10m) and too long to
  #    separate by `for:` (~20 min), so the session gate is the only cut that
  #    keeps the alert able to page on genuine in-session skew.
  #
  # `for:` matches the lookback window on purpose, and that is not a tuning
  # constant. A range vector straddles the session boundary: for one full range
  # length after the open, `increase(...[10m])` is still summing crossings from
  # before it, so the gate alone left one 8-minute burst at 08:45-08:52 CST.
  # Holding for at least the lookback guarantees every sample in the window is
  # itself in-session. Ten minutes of delay is acceptable here because this
  # warning is about whether recorded exch_ts is trustworthy for research and
  # latency work -- it stops nothing trading.
  - alert: FeedTimeSkewCritical
    expr: |
      increase(feed_time_skew_over_threshold_total{severity="critical_60s",topic!="snapshot"}[10m]) > 0
      and on() market_trading_hours_active == 1
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "Exchange timestamps are more than 60s behind local time"
        description: |
          topic="{{ $labels.topic }}" saw exchange/local timestamp skew above
          60s in the last 10m. The normalizer clamps local_ts to
          exch_ts + HFT_TS_MAX_LAG_S, so downstream ordering is protected, but
          the recorded exch_ts for this topic is not trustworthy for latency
          or research use while this fires. Most common cause is a broker
          ts_epoch problem on a specific contract — the "feed_time_skew"
          warning log carries symbol and raw_delta_ns.

  # Scheduled resubscribes run on a daemon thread; before they recorded an
  # outcome an escaping exception reached only threading.excepthook.
  - alert: RecorderDeadLetterQueueGrowing
    expr: increase(dlq_size_total[30m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Recorder dead-lettered a batch"
        description: |
          The recorder failed a ClickHouse insert past its retries and wrote the
          batch to .wal/dlq/. Those rows are NOT in ClickHouse. Read the first
          line of the newest .wal/dlq/<table>_*.jsonl for the table and error,
          then check `SELECT name FROM system.columns` for that table -- a
          schema drift between the migration ledger and the live table is the
          way this has failed before (hft.fills, 2026-04-25 to 2026-08-21, four
          months undetected because this alert did not exist).

  - alert: RecorderDeadLetterQueueNonEmpty
    expr: wal_file_count_tiered{tier="dlq"} > 0
    for: 30m
    labels:
        severity: warning
    annotations:
        summary: "Dead-letter queue has unreplayed batches"
        description: |
          {{ $value }} dead-letter file(s) have been sitting in .wal/dlq/ for
          30m. DLQ files are never replayed automatically; they stay until an
          operator replays them. This fires for as long as the backlog exists,
          unlike the increase()-based alert above which only catches the moment
          of failure.

  - alert: WALReplayBacklogStalled
    expr: wal_backlog_files > 0 and increase(wal_replay_throughput_rows_total[15m]) == 0
    for: 15m
    labels:
        severity: critical
    annotations:
        summary: "WAL backlog is not draining"
        description: |
          {{ $value }} WAL file(s) are queued and no rows have been replayed in
          15m. ClickHouse ingestion has stopped while the durability path keeps
          writing. Check the wal-loader container and ClickHouse health before
          the disk fills.

  - alert: FeedResubscribeFailing
    expr: increase(feed_resubscribe_total{result="error"}[10m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Feed resubscribe raised"
        description: |
          A resubscribe attempt raised in the last 10m. Subscriptions may be
          short of the configured basket; compare
          hft_quote_conn_subscribed_count against the expected total before
          trusting the feed for a session.

  # Contract freshness (rewritten 2026-07-31 against measured behaviour; the
  # 2026-07-29 originals were authored on a model that field data disproved and
  # were never deployed — see the "Contract freshness alerts" section of
  # docs/runbooks/shioaji-contract-refresh-operations.md).
  #
  # `contract_cache_last_success_ts` is written by the *login-time* contract
  # load, not by the hourly poll: shioaji 1.5.x `fetch_contracts` needs sole
  # ownership of the inner client, which our 74 permanently-registered
  # subscriptions never release, so the poll fails 100% of the time by
  # construction. The gauge therefore tracks login cadence, and logins cluster
  # at session boundaries. Measured on THESHOW over 24 h: gaps of 6.01 h
  # (22:58 CST restart -> 05:00 CST night close) and 3.43 h (05:00 -> 08:30
  # CST). The worst *legitimate* case is a restart at night-session open with
  # no relogin until the 05:00 CST close — about 14 h, entirely inside trading
  # hours. 18 h is that worst case plus margin; anything shorter alerts on
  # normal overnight operation.
  - alert: ContractCacheStale
    expr: contract_cache_last_success_ts > 0 and contract_cache_last_success_ts < (time() - 64800) and on() market_trading_hours_active == 1
    for: 30m
    labels:
        severity: warning
    annotations:
        summary: "Contracts have not been reloaded for >18h during trading hours"
        description: |
          Last contract load was {{ $value | humanizeTimestamp }}. Contracts are
          only ever as fresh as the last login, so this means no facade has
          logged in across a session boundary it should have crossed. Check
          hft_quote_conn_logged_in and the reconnect windows
          (HFT_RECONNECT_HOURS / HFT_RECONNECT_HOURS_2); a stranded facade that
          never relogs in is the usual cause, not the contract path itself.
          The `> 0` gate keeps this quiet before a fresh process's first login.

  # The real staleness condition, and the reason the poll was never needed: the
  # broker announces contract changes on APISUB/V1/SYS/CONTRACT, and
  # `contract_update_last_event_ts` records when it last did. If the broker has
  # said contracts changed more recently than we last loaded them, we are
  # provably stale — no cadence assumption required.
  #
  # NOTE (2026-07-31): no announcement has been observed yet, so this alert is
  # unproven in the field and its FIRST firing is as much information as
  # incident. It is still open whether the SDK refreshes its own cache on this
  # event or merely notifies; if it self-refreshes, api.Contracts is already
  # current and this fires benignly. Confirm against api.Contracts before
  # treating a first firing as a fault, and record the answer in the runbook.
  #
  # The `registered` gate (added 2026-08-02) matters more than it looks: this
  # rule's silence is only evidence if the push callback is actually attached.
  # Before contract_event_callback_registered existed, "registered and the
  # broker is quiet" and "registration failed at startup" were the same
  # observation (last_event_ts == 0), and the alert would have stayed green
  # through the second. ContractEventCallbackUnregistered below covers that.
  - alert: ContractsStaleVsBrokerAnnouncement
    expr: contract_update_last_event_ts > 0 and contract_update_last_event_ts > contract_cache_last_success_ts and on() (max(contract_event_callback_registered) == 1)
    for: 15m
    labels:
        severity: warning
    annotations:
        summary: "Broker announced a contract change after our last contract load"
        description: |
          The broker announced a contract change at
          {{ $value | humanizeTimestamp }}, which is later than our last
          contract load. Check contract_update_events_total{action,security_type}
          — action="force" means the broker considers the change mandatory,
          action="check" means it expects the client to compare check_file_ts.
          Remediation today is an engine restart, which reloads contracts at
          login; the hourly poll cannot do it.

  # The push callback is now the ONLY contract-change signal this platform has:
  # the hourly fetch_contracts poll was removed 2026-08-02 because it could not
  # succeed on a subscribed facade (96/96 failures over 24 h). A facade whose
  # registration failed is therefore blind, and it fails quietly — registration
  # errors are logged and non-fatal by design, because contracts still load at
  # login. `< 4` rather than `== 0`: one blind facade out of four is still a
  # gap, and the series is per-conn_id.
  - alert: ContractEventCallbackUnregistered
    expr: count(contract_event_callback_registered == 1) < 4
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "A facade is not registered for broker contract-change pushes"
        description: |
          Only {{ $value }} of 4 facades have the SYS/CONTRACT push callback
          registered. Registration happens once per facade when its contract
          refresh thread starts and is non-fatal on failure, so this can persist
          silently. With the hourly poll removed, an unregistered facade has no
          way to learn that contracts changed between logins. Grep the engine
          log for "Failed contract event callback registration" and
          "contract_event_callback_unsupported"; the latter means the SDK build
          does not expose set_contract_event_callback at all.

  - alert: FeedReconnectFailureRatioHigh
    expr: |
      (
        (sum(increase(feed_reconnect_total{result=~"fail|exception"}[1h])) or vector(0))
        /
        clamp_min((sum(increase(feed_reconnect_total{result=~"ok|fail|exception"}[1h])) or vector(0)), 1)
      ) > 0.2
      and on() market_trading_hours_active == 1
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "Feed reconnect failure ratio high"
        description: "Reconnect fail+exception ratio exceeded 20% over the last 1h."

  - alert: QuoteWatchdogCallbackReregisterHigh
    expr: increase(quote_watchdog_recovery_attempts_total{action="callback_reregister"}[1h]) > 10
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "Quote watchdog callback re-register spikes"
        description: "No quote data callback re-register attempts exceeded threshold in the last 1h."

  - alert: ShioajiWatchdogThreadDown
    expr: max_over_time(shioaji_thread_alive{thread="quote_watchdog"}[5m]) < 1 and market_trading_hours_active == 1
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Shioaji quote watchdog thread down"
        description: "quote_watchdog liveness gauge has been 0 for >1m."
        runbook_url: "docs/runbooks/ShioajiWatchdogThreadDown.md"

  - alert: ShioajiPendingQuoteStall
    expr: shioaji_quote_pending_age_seconds > 300 and on() market_trading_hours_active == 1
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: "Shioaji pending quote state stalled"
        description: "pending_quote_resubscribe age > 300s for more than 5m during trading hours. The age gauge counts up continuously from the last session close, so this rule is gated on market_trading_hours_active (calendar-aware, holidays included) — without that gate it fired every weekend and holiday."

  - alert: QuoteFacadeLoggedOut
    expr: (count(hft_quote_conn_logged_in) - sum(hft_quote_conn_logged_in)) > 0 and on() market_trading_hours_active == 1
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: "A quote facade is logged out during trading hours"
        description: "At least one quote connection reports hft_quote_conn_logged_in=0 while the market is open. FeedState stays CONNECTED as long as any facade is up, so a partially logged-out pool silently loses whatever symbols that facade carried. Expressed as count-minus-sum so it adapts to the configured pool size instead of hardcoding 4."
        runbook_url: "docs/runbooks/feed-reconnect.md"

  - alert: QuotePoolFullyUnsubscribed
    expr: sum(hft_quote_conn_subscribed_count) == 0 and on() market_trading_hours_active == 1
    for: 2m
    labels:
        severity: critical
    annotations:
        summary: "Quote pool holds zero subscriptions during trading hours"
        description: "Every quote connection reports subscribed_count=0 while the market is open — the engine is connected but receiving nothing. FeedState=CONNECTED does not catch this."
        runbook_url: "docs/runbooks/feed-reconnect.md"

  - alert: QuoteFacadeDataStalled
    expr: hft_quote_conn_last_data_age_s > 300 and on() market_trading_hours_active == 1
    for: 5m
    labels:
        severity: critical
    annotations:
        summary: "A quote facade has delivered no data for >5m during trading hours"
        description: "Per-connection liveness. FeedGapCritical only sees rate(feed_events_total), which stays healthy while any facade still ticks, and hft_quote_conn_subscribed_count holds len(subscribed_codes) from the last successful subscribe, which simply persists across a logout — so it stays at 74 even for a dead facade. This gauge is the only signal that catches a facade which is logged in but silent. Measured 2026-07-22..26: healthy facades sit at p95 < 1s during trading hours, so 300s has no observed false-positive. It is only as good as its publisher — see QuotePoolMetricsPublisherStalled."
        runbook_url: "docs/runbooks/feed-reconnect.md"

  - alert: QuotePoolMetricsPublisherStalled
    expr: rate(hft_quote_pool_metrics_published_total[5m]) == 0 and on() market_trading_hours_active == 1
    for: 5m
    labels:
        severity: critical
    annotations:
        summary: "Per-connection quote metrics are no longer being published"
        description: "QuoteConnectionPool.update_metrics() is the sole writer of hft_quote_conn_{logged_in,last_data_age_s,subscribed_count,state}. If it stops, those gauges freeze at their last value rather than going stale-absent, so a frozen last_data_age_s below 300 silently disables QuoteFacadeDataStalled — the detector fails exactly the way the 2026-07-25 facade did. This rule watches the detector itself."
        runbook_url: "docs/runbooks/feed-reconnect.md"

  - alert: ShioajiSessionRefreshThreadDown
    expr: max_over_time(shioaji_thread_alive{thread="session_refresh"}[5m]) < 1
    for: 10m
    labels:
        severity: critical
    annotations:
        summary: "Shioaji session refresh thread is dead"
        description: "The preventive session-refresh thread exited. It owns re-login after a failed refresh, so once it is gone the facade cannot recover on its own. Deliberately NOT gated on market_trading_hours_active: the thread dying while the market is shut is exactly the case that stranded a facade for 24h on 2026-07-25, and it must be fixed before the next open."
        runbook_url: "docs/runbooks/feed-reconnect.md"

  - alert: ShioajiLoginFailuresDetected
    expr: increase(shioaji_login_fail_total[10m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Shioaji login failures detected"
        description: "Login attempts exhausted retries in the last 10m."

  - alert: ShioajiCrashSignatureDetected
    expr: increase(shioaji_crash_signature_total[10m]) > 0 and on() market_trading_hours_active == 1
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Shioaji crash precursor signature detected"
        description: "Detected known crash signature {{ $labels.signature }} in {{ $labels.context }} path in the last 10m."
        runbook_url: "docs/runbooks/ShioajiCrashSignatureDetected.md"

  - alert: FeedSessionConflictDetected
    expr: increase(feed_session_conflict_total[10m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Feed session ownership conflict detected"
        description: "Another runtime owner was detected for Redis feed session lease in the last 10m."

  - alert: ShioajiSessionLockConflictDetected
    expr: increase(shioaji_session_lock_conflicts_total[10m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Shioaji session lock conflict detected"
        description: "Potential multi-runtime broker session lock conflict detected in the last 10m."

  - alert: BusOverflowCritical
    expr: increase(bus_overflow_total[1m]) > 0
    for: 1s
    labels:
        severity: critical
    annotations:
        summary: "Event Bus Overflow"
        description: "Events dropped due to full ring buffer."

  # Risk
  - alert: StormGuardHalt
    expr: stormguard_mode == 3
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "StormGuard HALT Triggered"
        description: "Strategy {{ $labels.strategy }} hit HALT threshold."
        runbook_url: "docs/runbooks/StormGuardHalt.md"

  - alert: StormGuardHaltStuck
    expr: stormguard_mode == 3
    for: 5m
    labels:
        severity: critical
    annotations:
        summary: "StormGuard stuck in HALT for >5 minutes"
        description: "StormGuard has been in HALT state for over 5 minutes. Manual intervention may be required."
        runbook_url: "docs/runbooks/StormGuardHalt.md"

  - alert: HighRejectRate
    expr: rate(order_reject_total[1m]) / (rate(order_actions_total[1m]) + 1) > 0.1
    for: 1m
    labels:
        severity: warning
    annotations:
        summary: "High Order Reject Rate"
        description: "Reject rate > 10%."
        runbook_url: "docs/runbooks/HighRejectRate.md"

  # Execution Health
  - alert: ExecutionLagHigh
    expr: histogram_quantile(0.99, sum(rate(execution_router_lag_ns_bucket[30s])) by (le)) > 1e7
    for: 30s
    labels:
        severity: warning
    annotations:
        summary: "Execution Lag High"
        description: "P99 execution report lag > 10ms."

  - alert: QueueDepthSpike
    expr: max_over_time(queue_depth[30s]) > 1000
    for: 30s
    labels:
        severity: warning
    annotations:
        summary: "Queue Depth Spike"
        description: "Queue depth exceeded 1000 in the last 30s."

  - alert: ExecutionGatewayTaskDown
    expr: max_over_time(execution_gateway_alive[2m]) < 1
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Execution gateway task down"
        description: "execution_gateway_alive has been 0 for more than 1 minute."

  - alert: ExecutionRouterTaskDown
    expr: max_over_time(execution_router_alive[2m]) < 1
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Execution router task down"
        description: "execution_router_alive has been 0 for more than 1 minute."

  - alert: RawQueueDropsDetected
    expr: increase(raw_queue_dropped_total[5m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Raw queue drops detected"
        description: "Market data callback queue dropped payloads in the last 5m."

  - alert: ShioajiCallbackIngressLatencyP99High
    expr: histogram_quantile(0.99, sum(rate(shioaji_quote_callback_ingress_latency_ns_bucket[5m])) by (le)) > 1e5
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Shioaji callback ingress latency high"
        description: "Callback ingress latency p99 exceeded 100us for 2m."

  - alert: CallbackParseMissDetected
    expr: increase(market_data_callback_parse_total{result="miss"}[10m]) > 0
    for: 0s
    labels:
        severity: warning
    annotations:
        summary: "Callback parser miss detected"
        description: "market_data callback parser miss increased in the last 10m."

  # Infra
  - alert: RecorderFailure
    expr: increase(recorder_failures_total[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Recorder Write Failed"
        description: "ClickHouse ingestion failing."
        runbook_url: "docs/runbooks/RecorderFailure.md"

  - alert: RecorderInsertFailedRatioHigh
    expr: |
      (
        (sum(increase(recorder_insert_batches_total{result=~"failed_after_retry|failed_no_client"}[24h])) or vector(0))
        /
        clamp_min((sum(increase(recorder_insert_batches_total{result=~"success_no_retry|success_after_retry|failed_after_retry|failed_no_client"}[24h])) or vector(0)), 1)
      ) > 0.005
    for: 15m
    labels:
        severity: warning
    annotations:
        summary: "Recorder insert failed ratio high"
        description: "24h insert failed ratio exceeded 0.5% SLO."

  - alert: RecorderInsertRetryRatioHigh
    expr: |
      (
        (sum(increase(recorder_insert_batches_total{result=~"success_after_retry|failed_after_retry"}[24h])) or vector(0))
        /
        clamp_min((sum(increase(recorder_insert_batches_total{result=~"success_no_retry|success_after_retry|failed_after_retry|failed_no_client"}[24h])) or vector(0)), 1)
      ) > 0.05
    for: 15m
    labels:
        severity: warning
    annotations:
        summary: "Recorder insert retry ratio high"
        description: "24h insert retry ratio exceeded 5% guardrail."

  # CE-M2 Gateway SLO / schema guard
  - alert: GatewayDispatchLatencyP99High
    expr: histogram_quantile(0.99, sum(rate(gateway_dispatch_latency_ns_bucket[5m])) by (le)) > 2e6
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Gateway dispatch latency high"
        description: "Gateway dispatch latency p99 > 2ms for 2m."

  - alert: GatewayIntentChannelDepthHigh
    expr: max_over_time(gateway_intent_channel_depth[5m]) > 500
    for: 1m
    labels:
        severity: warning
    annotations:
        summary: "Gateway intent channel depth high"
        description: "Gateway intent queue depth exceeded 500."

  - alert: QuoteSchemaMismatchDetected
    expr: increase(quote_schema_mismatch_total[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Quote schema mismatch rejected"
        description: "Shioaji callback payload failed quote schema guard."

  # Feature Plane canary / parity SLO
  - alert: FeatureShadowParityMismatchDetected
    expr: increase(feature_shadow_parity_mismatch_total[10m]) > 0
    for: 2m
    labels:
        severity: critical
    annotations:
        summary: "Feature shadow parity mismatch detected"
        description: "Feature shadow parity mismatches occurred in the last 10m."

  # Threshold calibrated 2026-04-25 against measured baseline on the WSL+Docker
  # deploy target: P50=77us, P95=154us, P99=191us. The original 50us threshold
  # was below P50 and fired continuously. 500us is ~2.5x current P99 — tight
  # enough to catch a real regression, loose enough to ride normal variance.
  # Revisit if the deploy hardware changes (bare metal would cut these by ~3x).
  - alert: FeaturePlaneLatencyP99High
    expr: histogram_quantile(0.99, sum(rate(feature_plane_latency_ns_bucket[5m])) by (le)) > 5e5
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: "Feature plane latency p99 high"
        description: "feature_plane_latency_ns p99 exceeded 500us for 5m."

  - alert: FeatureQualityFlagsSpike
    expr: sum(increase(feature_quality_flags_total{flag=~"gap|out_of_order"}[10m])) > 0
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Feature quality flags spike"
        description: "Corrupt feature quality flags (gap/out_of_order) increased in the last 10m. state_reset is excluded -- it is a designed warmup/reconnect signal that trickles in for hours after startup as thinly-traded symbols tick."

  - alert: FeaturePlaneUpdateErrorRatioHigh
    expr: |
      (
        (sum(increase(feature_plane_updates_total{result="error"}[30m])) or vector(0))
        /
        clamp_min((sum(increase(feature_plane_updates_total{result=~"updated|emitted|error"}[30m])) or vector(0)), 1)
      ) > 0.01
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "Feature plane update error ratio high"
        description: "Feature update error ratio exceeded 1% over the last 30m."

  # Disk Space (Host)
  - alert: HostDiskSpaceCritical
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Root filesystem < 10% free"
        description: "Host {{ $labels.instance }} root partition has less than 10% disk space available."
        runbook_url: "docs/runbooks/HostDiskSpaceCritical.md"

  - alert: HostDiskSpaceWarn
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: "Root filesystem < 20% free"
        description: "Host {{ $labels.instance }} root partition approaching capacity (< 20% free)."

  - alert: ClickHouseSystemLogSizeCritical
    expr: |
      sum by (table) (
        clickhouse_table_parts_bytes{database="system", table=~"trace_log|text_log|part_log|query_log"}
      ) > 10 * 1024 * 1024 * 1024
    for: 10m
    labels:
        severity: warning
    annotations:
        summary: "ClickHouse system log table > 10 GB"
        description: "system.{{ $labels.table }} has exceeded 10 GB. TTL may not be running. Consider TRUNCATE."

  # Reconciliation / Execution Router Health
  - alert: ReconciliationDiscrepancyDetected
    expr: reconciliation_discrepancy_count > 0
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "Reconciliation discrepancy detected"
        description: "reconciliation_discrepancy_count has been > 0 for more than 1 minute; position state may diverge from broker."

  # The `> 0` gate is load-bearing. execution_router_heartbeat_ts is a Gauge,
  # so prometheus_client publishes it as 0 from process start until the router
  # first beats -- and `time() - 0` is ~1.8e9, far past 120. With `for: 0s` and
  # severity critical, every engine restart paged instantly: THESHOW fired this
  # at 14:16Z on 2026-08-23, the exact minute of the restart, and it cleared on
  # its own. Same defect and same fix as AlphaSignalSilent above; an unset gauge
  # reads as a confident zero, and zero means "healthy" to some rules and
  # "dead" to others.
  - alert: ExecutionRouterHeartbeatStale
    expr: time() - execution_router_heartbeat_ts > 120 and execution_router_heartbeat_ts > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Execution router heartbeat stale"
        description: "Execution router heartbeat has not been updated for > 120s; router may be hung or crashed."

  - alert: ExecutionRouterLagP99High
    expr: histogram_quantile(0.99, sum(rate(execution_router_lag_ns_bucket[1m])) by (le)) > 5e7
    for: 1m
    labels:
        severity: warning
    annotations:
        summary: "Execution router lag p99 high"
        description: "Execution router lag p99 exceeded 50ms for 1m."

  # CE-M3 WAL SLO
  - alert: WALReplayLagHigh
    expr: wal_replay_lag_seconds > 600
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "WAL replay lag high"
        description: "Oldest pending WAL file age > 600s."

  - alert: WALBacklogFilesHigh
    expr: wal_backlog_files > 200
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "WAL backlog file count high"
        description: "Pending WAL files exceed 200."

  - alert: WALDrainETAHigh
    expr: wal_drain_eta_seconds > 900
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "WAL drain ETA high"
        description: "Estimated WAL drain ETA exceeds 15 minutes."

  # ClickHouse connection health
  - alert: ClickHouseConnectionDown
    expr: clickhouse_connection_health == 0
    for: 2m
    labels:
        severity: critical
    annotations:
        summary: "ClickHouse connection down"
        description: "ClickHouse heartbeat failed for >2m. Engine may be falling back to WAL-only writes."
        runbook_url: "docs/runbooks/ClickHouseConnectionDown.md"

  # WAL disk pressure — WAL directory size (DiskPressureMonitor is the only writer
  # of disk_pressure_level; WAL writers report free space separately below)
  - alert: WALDiskPressureCritical
    expr: disk_pressure_level >= 2
    for: 30s
    labels:
        severity: critical
    annotations:
        summary: "WAL disk pressure critical"
        description: "WAL disk pressure at CRITICAL or HALT level. Data may be dropped."
        runbook_url: "docs/runbooks/WALDiskPressureCritical.md"

  # WAL free-space circuit breaker — distinct from the size-based level above.
  # Previously invisible: the WAL writers signalled free-space pressure by
  # overwriting disk_pressure_level, which clobbered DiskPressureMonitor's value.
  - alert: WALDiskCircuitBreakerActive
    expr: max(wal_disk_circuit_breaker_active) > 0
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: "WAL writer free-space circuit breaker tripped"
        description: "A WAL writer tripped its free-space circuit breaker (HFT_WAL_DISK_MIN_MB). Check wal_disk_available_mb — this is free disk, not WAL directory size."
        runbook_url: "docs/runbooks/WALDiskPressureCritical.md"

  # Pipeline dual-fault (CH + WAL both failed)
  - alert: PipelineDataLoss
    expr: pipeline_health_state >= 3
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Recorder pipeline DATA_LOSS — both ClickHouse and WAL failed"
        description: "pipeline_health_state has reached DATA_LOSS (3). Market data is being dropped with no persistence path available."

  # Recorder reinject circuit breaker — permanent data loss
  - alert: RecorderReinjectCircuitBreakerOpen
    expr: increase(recorder_reinject_circuit_breaker_drops_total[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Recorder reinject circuit breaker open — PERMANENT DATA LOSS"
        description: "Both ClickHouse and WAL have failed repeatedly. Rows are being permanently dropped."

  # Execution recording drops
  - alert: RecorderExecDropsDetected
    expr: increase(recorder_exec_drops_total[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Execution event recording drops detected"
        description: "Fill/order events are being dropped from the recorder queue."

  # Execution WAL fallback failure
  - alert: RecorderExecWalFallbackFailure
    expr: increase(recorder_exec_wal_fallback_failure_total[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Execution WAL fallback failure — data loss risk"
        description: "WAL fallback for execution events has failed."

  # Fill data loss
  - alert: ExecFillDataLossDetected
    expr: increase(exec_fill_data_loss[5m]) > 0
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Fill data loss detected"
        description: "Fill events have been permanently lost."

  # Schema initialization failure (WAL-only degraded mode)
  - alert: RecorderSchemaInitFailed
    expr: recorder_schema_init_failed == 1
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Recorder schema initialization failed — WAL-only mode"
        description: "ClickHouse schema migration failed at startup. All data is going to WAL with no ClickHouse persistence path."

  # Event loop lag.
  #
  # Reads event_loop_probe_lag_ms, NOT event_loop_lag_ms. The latter is named
  # for what this alert wants but does not measure it: services/system.py times
  # its own whole supervisor tick period, so the gauge is loop congestion PLUS
  # the supervisor's own work, and the source comment there says so outright.
  # Measured on THESHOW 2026-08-24 over 1 h: event_loop_lag_ms averaged 7.31 ms,
  # of which supervisor_tick_duration_ms was 5.90 ms and true probe lag only
  # 1.19 ms -- the two halves sum back to the composite, and 81% of it was the
  # supervisor timing itself. A 5 ms threshold therefore sat *below* the
  # supervisor's own mean body time, which is why this alert flapped through 15
  # separate firing episodes in a single healthy day. StormGuard's loop-lag
  # input was moved off the composite onto the probe for exactly this reason
  # (see SystemSupervisor._stormguard_latency_us); this rule had not followed.
  #
  # Threshold from the probe's own distribution over 782,926 samples: p50
  # 0.47 ms, p90 1.63 ms, p99 15.94 ms, p99.9 47.29 ms, and the worst 5-minute
  # p99 in 24 h of healthy operation was 59.49 ms. 100 ms is ~1.7x that healthy
  # maximum, so a normal day cannot reach it, while an order-of-magnitude
  # degradation still pages. Do NOT lower this to the 1 ms hot-path budget:
  # today's p99 exceeds that routinely, so such a rule would fire permanently
  # and mean nothing. That the steady-state p99 is 16 ms against a 1 ms budget
  # is a real engineering question, but it is a latency question, not an
  # alerting one.
  - alert: EventLoopLagHigh
    expr: |
      histogram_quantile(0.99, sum by (le) (rate(event_loop_probe_lag_ms_bucket[5m]))) > 100
      and on() market_trading_hours_active == 1
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Event loop lag high"
        description: >-
          p99 event-loop unavailability exceeded 100ms over 5 minutes, sustained
          for 2 minutes, while the market was open. This is time the loop was
          unavailable to any callback, hot path included, measured by the idle
          probe task rather than by the supervisor timing itself.

  # Strategy exceptions
  - alert: StrategyExceptionsRateHigh
    expr: rate(strategy_exceptions_total[5m]) > 0.1
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Strategy exceptions rate high"
        description: "Strategy exception rate > 0.1/s for 2 minutes."

  # Portfolio drawdown
  - alert: PortfolioDrawdownHigh
    expr: portfolio_drawdown_pct > 0.05
    for: 1m
    labels:
        severity: warning
    annotations:
        summary: "Portfolio drawdown > 5%"
        description: "Portfolio has drawn down more than 5% from peak realized PnL."

  - alert: PortfolioDrawdownCritical
    expr: portfolio_drawdown_pct > 0.10
    for: 0s
    labels:
        severity: critical
    annotations:
        summary: "Portfolio drawdown > 10%"
        description: "Portfolio drawdown exceeded 10%. StormGuard should be in HALT."

  # Redis health monitoring removed 2026-04-24 — engine does not probe Redis
  # (no `redis` Python module in engine container; only the separate monitor
  # container uses Redis). The `redis_connection_health` gauge had no setter,
  # so this alert fired continuously on a default-0 gauge. Re-introduce at the
  # component that actually probes Redis (monitor) when needed.

  - alert: OrphanedFillDetected
    expr: increase(orphaned_fill_total[5m]) > 0
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: Orphaned fills detected
        runbook_url: docs/runbooks/OrphanedFillDetected.md
  - alert: SLOFeedAvailabilityBurnRateHigh
    expr: 1 - slo:feed_availability:ratio_rate5m > 0.01
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: Feed availability SLO burn rate high
  - alert: SLOOrderSuccessRateLow
    expr: slo:order_success:ratio_rate5m < 0.995
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: Order success rate below SLO

  # Loki Health
  - alert: LokiDown
    expr: up{job="loki"} == 0
    for: 2m
    labels:
        severity: warning
    annotations:
        summary: "Loki log aggregation is down"
        description: "Loki has been unreachable for >2 minutes. Log search unavailable."

  # ── Backup Health ─────────────────────────────────────────────
  # `hft_backup_last_success_ts > 0` gate (2026-04-25): the cron-driven backup
  # runs as a one-shot `docker compose exec hft-engine python -c ...` subprocess.
  # Its MetricsRegistry.get() returns a fresh registry in that subprocess and
  # is not the engine's scrape target, so the gauge never leaves 0 even though
  # backups have succeeded daily (see /tmp/hft_backup.log on prod). Without the
  # gate, `0 < time() - 172800` is always true and BackupStale fires forever.
  # TODO(ops): structural fix — either Pushgateway, node_exporter textfile
  # collector, or have the engine stat $BACKUP_DIR mtime periodically and
  # update the gauge. Until then this gate disables the alert; monitor backup
  # health via /tmp/hft_backup.log tailing.
  - alert: BackupStale
    expr: hft_backup_last_success_ts < (time() - 172800) and hft_backup_last_success_ts > 0
    for: 1h
    labels:
        severity: critical
    annotations:
        summary: ClickHouse backup is stale (>2 days since last success)
        description: "Last successful backup was {{ $value | humanizeTimestamp }}. Check cron and backup disk."

  # ── Fill Loss (M-07) ─────────────────────────────────────────
  - alert: FillEvictionDetected
    expr: rate(exec_overflow_evicted_total[5m]) > 0
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Fill events are being evicted (data loss)"
      description: "exec_overflow_evicted_total is increasing. Fill events are being silently dropped."

  # ── Alpha Signal Silence (M-09) ──────────────────────────────
  # `alpha_last_signal_ts > 0` gate prevents false positives for strategies that
  # are registered (executor entry built by StrategyRunner) but have never
  # emitted an intent — e.g. config-disabled strategies. Without the gate,
  # `time() - 0` always exceeds 300 and the alert fires forever at startup.
  # Use all alpha decision outcomes for liveness: a strategy can be healthy while
  # emitting only flat decisions, so non-flat timestamp age alone is not silence.
  - alert: AlphaSignalSilent
    expr: |
      (sum by (strategy) (increase(alpha_signal_events_total[5m])) == 0)
      and on(strategy) alpha_last_signal_ts > 0
      and on() market_trading_hours_active == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "No alpha decisions for >5 minutes"
      description: "No intent or flat alpha decisions were observed for >5 minutes after the strategy had previously emitted an intent. Alpha pipeline may be stalled."

  # ── Trading Liveness (2026-08-08) ────────────────────────────
  # Every rule above this point asks "is something broken". None of them ask
  # "is the thing that is supposed to happen happening", which is why R47 went
  # from 2026-06-08 to 2026-08-08 producing zero intents across 16.7M events
  # with 83 rules armed and not one of them firing.
  #
  # AlphaSignalSilent above cannot catch it by design: it counts *all* alpha
  # outcomes and states outright that "a strategy can be healthy while emitting
  # only flat decisions". 16,754,489 flats and 0 intents satisfied it perfectly.
  - alert: StrategyBoundToNoLiveSymbols
    expr: strategy_bound_live_symbols == 0 and on() market_trading_hours_active == 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Strategy {{ $labels.strategy_id }} is bound to no symbol the feed carries"
      description: >-
        None of this strategy's configured symbols appear in the subscribed
        feed, so StrategyBase.handle_event drops every event at its symbol
        filter and no intent can ever be produced. Usual cause: the strategy is
        pinned to an expired expiry and the contract-family rebind did not run.
        Check `post_connect_hooks_ran` and
        `shioaji_family_populator_snapshot_installed` in the engine log.
      runbook_url: "docs/runbooks/alpha-development-workflow.md"

  - alert: StrategyProducesNoIntentsDuringSession
    expr: |
      (sum by (strategy) (increase(alpha_signal_events_total{outcome="intent"}[30m])) == 0)
      and (sum by (strategy) (increase(alpha_signal_events_total{outcome="flat"}[30m])) > 0)
      and on() market_trading_hours_active == 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Strategy {{ $labels.strategy }} has decided flat on every event for 30m"
      description: >-
        The strategy is registered, receiving events and deciding — the flat
        counter is moving — but has not produced a single intent in 30 minutes
        of open session. The `flat > 0` term is what separates this from a
        disabled or unsubscribed strategy, so unlike AlphaSignalSilent this
        rule does not need `alpha_last_signal_ts > 0` and therefore still fires
        for a strategy that has *never* emitted an intent.

  # A connect gate refusing is correct, deliberate behaviour — and it looks
  # from the outside exactly like a broker outage, because the engine ends up
  # with no subscription and therefore no data. Feed-gap alerts will fire, but
  # they name the symptom; this one names the cause, so nobody spends an
  # outage hunting a network fault that is really an expired contract.
  - alert: FeedConnectGateBlockedConnect
    expr: increase(feed_connect_gate_blocked_total[10m]) > 0
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Connect refused by safety gate {{ $labels.gate }} — feed is down on purpose"
      description: >-
        A pre-subscribe safety gate refused the connect, so the engine holds no
        subscription and no market data is flowing. This is fail-closed
        behaviour, not a crash. Most likely cause: config/symbols.yaml still
        lists a contract that has passed its delivery date. Check the
        `connect_gate_blocked` log event for the offending code, regenerate
        symbols.yaml, and restart.

  # ── Autonomy Control-Plane (M-10) ────────────────────────────
  - alert: StrategyQuarantineActive
    expr: strategy_quarantine_active == 1
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Strategy quarantine is active"
      description: "A strategy has been quarantined. Manual review required."

  - alert: PlatformReduceOnlyActive
    expr: platform_reduce_only_active == 1
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Platform is in reduce-only mode"
      description: "New positions are blocked. Only position reduction is allowed."

  - alert: ManualRearmRequired
    expr: manual_rearm_required == 1
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Manual rearm required"
      description: "Platform requires manual intervention to resume normal operations."

  - alert: AutonomyStateTransition
    expr: increase(autonomy_transitions_total[5m]) > 0
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: "Autonomy state transition detected"
      description: "The autonomy control-plane changed state. Check current mode."

  # ── Gateway Heartbeat (M-11) ─────────────────────────────────
  - alert: ExecutionGatewayHeartbeatStale
    expr: execution_gateway_heartbeat_ts > 0 and (time() - execution_gateway_heartbeat_ts) > 60
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Execution Gateway heartbeat is stale (>60s)"
      description: "execution_gateway_heartbeat_ts has not been updated in >60 seconds."

  # ── WAL Integrity (M-12) ─────────────────────────────────────
  - alert: WALCorruptionDetected
    expr: increase(wal_corrupt_files_total[1h]) > 0
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "Corrupt WAL files detected"
      description: "{{ $value }} corrupt WAL file(s) quarantined in the last hour."

  - alert: WALReplayErrorsDetected
    expr: increase(wal_replay_errors_total[1h]) > 0
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: "WAL replay errors detected"
      description: "{{ $value }} WAL replay error(s) in the last hour."

  # ── ClickHouse Pool (M-13) ───────────────────────────────────
  # DISABLED: clickhouse_pool_timeout_total is registered but never incremented.
  # Re-enable when writer.py semaphore acquisition is instrumented.
  # - alert: ClickHousePoolExhausted
  #   expr: increase(clickhouse_pool_timeout_total[5m]) > 0
  #   for: 0s
  #   labels:
  #     severity: critical
  #   annotations:
  #     summary: "ClickHouse connection pool timeouts detected"
  #     description: "{{ $value }} pool timeout(s) in 5 minutes. Writes may be stalling."

  # ── Research Data Disk ──────────────────────────────────────────
  - alert: ResearchDataTooLarge
    expr: hft_research_data_bytes > 200e9
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "Research data exceeds 200 GB"
      description: "research/data/ is {{ $value | humanize1024 }}. Check rotation script."

  # ── SSD Health ──────────────────────────────────────────────────
  - alert: SSDReallocatedSectorsHigh
    expr: smartmon_reallocated_sectors > 100
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: "SSD has >100 reallocated sectors"
      description: "Device {{ $labels.device }} has {{ $value }} reallocated sectors. Disk replacement recommended."

  - alert: SSDWearLevelLow
    expr: smartmon_wear_leveling > 0 and smartmon_wear_leveling < 20
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: "SSD wear level below 20%"
      description: "Device {{ $labels.device }} wear level at {{ $value }}%. Plan disk replacement."
