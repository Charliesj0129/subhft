global:
  resolve_timeout: 5m

time_intervals:
  # Mutes alerts outside TAIFEX trading sessions, matching
  # core/market_calendar.is_trading_hours(product_type="future"):
  #   day session   Mon-Fri 08:45-13:45 Asia/Taipei
  #   night session Mon-Fri 15:00 → next day 05:00 Asia/Taipei
  # Off-hours windows (union of below):
  - name: taipei_off_hours
    time_intervals:
      # weekday gap between night-close and day-open: 05:00-08:45
      - times:
          - start_time: "05:00"
            end_time: "08:45"
        weekdays: ["monday:friday"]
        location: "Asia/Taipei"
      # weekday lunch between day-close and night-open: 13:45-15:00
      - times:
          - start_time: "13:45"
            end_time: "15:00"
        weekdays: ["monday:friday"]
        location: "Asia/Taipei"
      # Saturday after final night-close at 05:00 → end of day
      - times:
          - start_time: "05:00"
            end_time: "24:00"
        weekdays: ["saturday"]
        location: "Asia/Taipei"
      # Sunday all day (no TAIFEX session)
      - weekdays: ["sunday"]
        location: "Asia/Taipei"
      # Monday 00:00-05:00 (no preceding trading day → no night session)
      - times:
          - start_time: "00:00"
            end_time: "05:00"
        weekdays: ["monday"]
        location: "Asia/Taipei"

route:
  group_by: [alertname, severity, symbol]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram-bridge
  routes:
    - match:
        severity: critical
      receiver: telegram-bridge
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 15m
      mute_time_intervals: [taipei_off_hours]
      continue: false

    - match:
        severity: warning
      receiver: telegram-bridge
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      mute_time_intervals: [taipei_off_hours]
      continue: false

    - match:
        severity: info
      receiver: "null"
      continue: false

    # Fallback for alerts without severity label — apply mute too.
    - matchers: ['severity!=critical', 'severity!=warning', 'severity!=info']
      receiver: telegram-bridge
      mute_time_intervals: [taipei_off_hours]
      continue: false

receivers:
  - name: telegram-bridge
    webhook_configs:
      - url: http://hft-engine:8081/webhook/alertmanager
        send_resolved: true

  - name: "null"

inhibit_rules:
  # ``equal: [alertname]`` was removed from every rule below on 2026-09-10
  # because it made all of them dead. ``equal`` requires the source and the
  # target alert to carry the SAME value for each listed label, so pairing a
  # critical source with a warning target and then demanding an identical
  # alertname asks for one name that exists at both severities. Parsing
  # rules.yaml: 93 rules, 93 distinct alert names, 45 critical-only and 48
  # warning-only, and zero names defined at more than one severity. No target
  # could ever satisfy both matchers, so this file has never suppressed
  # anything. The measured cost was one event paging four times -- see the
  # StormGuard pair below.
  #
  # Without ``equal`` these read the way their comments always claimed: while
  # the named infrastructure is down, its downstream warnings stay quiet.
  - source_matchers:
      - alertname = ClickHouseConnectionDown
    target_matchers:
      - severity = warning
  - source_matchers:
      - alertname = RedisConnectionDown
    target_matchers:
      - severity = warning
  - source_matchers:
      - alertname = HFTEngineDown
    target_matchers:
      - severity =~ warning|info

  # Replaces a generic "same-alertname critical suppresses warning" rule that
  # could never match, for the reason above. StormGuardHalt and
  # StormGuardHaltStuck are the identical expression ``stormguard_mode == 3``,
  # differing only in ``for:`` (0s vs 5m), so a HALT lasting longer than five
  # minutes always pages twice. The 2026-09-08 drawdown HALT held mode 3 for
  # 240 minutes and both fired for all of it. Keeping the ``for: 5m`` variant
  # inhibited preserves it as a distinct series in Prometheus while sending one
  # notification per HALT instead of two.
  - source_matchers:
      - alertname = StormGuardHalt
    target_matchers:
      - alertname = StormGuardHaltStuck
