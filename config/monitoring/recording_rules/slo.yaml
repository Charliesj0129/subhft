# WARNING: NOTHING LOADS THIS FILE.
#
# Production Prometheus (config/monitoring/prometheus.yml) has exactly one
# rule_files entry, /etc/prometheus/alerts/rules.yaml, and its container mounts
# only config/monitoring/alerts. Verified on THESHOW 2026-09-09: the running
# Prometheus reports a single rule group, HFT_Critical, with 93 rules. Nothing
# else in this repo -- no compose file, no Makefile target, no scrape config --
# references this path either.
#
# So every rule below has never been evaluated, including
# slo:e2e_order_latency:p95_ms_rate5m, which reads like a live SLO and is not
# one. Same family as a metric that is exported but never scraped: it looks
# green because it is absent, not because it is healthy.
#
# Add new recording rules to config/monitoring/alerts/rules.yaml instead. To
# revive this file, add it to rule_files AND mount its directory into the
# Prometheus container -- both, or it stays dead.

groups:
- name: slo_recording
  interval: 30s
  rules:
  - record: slo:feed_availability:ratio_rate5m
    expr: clamp_min(1 - (sum(increase(feed_events_total[5m])) == bool 0), 0)
  - record: slo:order_success:ratio_rate5m
    expr: (sum(rate(order_actions_total[5m])) or vector(0)) / clamp_min((sum(rate(order_actions_total[5m])) or vector(0)) + (sum(rate(order_reject_total[5m])) or vector(0)), 0.001)
  - record: slo:recorder_success:ratio_rate5m
    expr: 1 - ((sum(rate(recorder_failures_total[5m])) or vector(0)) / clamp_min((sum(rate(recorder_batches_flushed_total[5m])) or vector(0)), 0.001))
  - record: slo:normalize_latency_p99_us
    expr: histogram_quantile(0.99, sum(rate(pipeline_latency_ns_bucket{stage="normalize"}[5m])) by (le)) / 1000
  - record: slo:e2e_order_latency:p95_ms_rate5m
    expr: histogram_quantile(0.95, sum(rate(e2e_order_latency_ns_bucket[5m])) by (le)) / 1e6
