# Production Risk Limits
# Loaded by RiskEngine when HFT_ENV=prod (via paths.strategy_limits override in prod/main.yaml).
#
# Source of truth for risk limit values in production: this file supersedes
# config/base/strategy_limits.yaml. Every key here is read by code; the engine
# logs the effective values at boot (`risk_thresholds_effective`). A key nothing
# reads was removed 2026-10-23 (global_limits, max_order_qty, order_size_limit,
# max_order_per_min, daily_pnl_reset_hour, halt_requires_manual_recovery), along
# with config/env/prod/risk.yaml, which nothing loaded.
#
# Mini-TAIEX: 1 point = 10 NTD. Prices use scaled int (x10000).

global_defaults:
  # Plain NTD; notional = price * qty * point value. One TMF lot at 45,000
  # points is 450,000 NTD (passes); one TXF lot is ~9,000,000 (rejected).
  # Orders that reduce a position are exempt. Until 2026-10-23 these held
  # 1,000,000,000 ("100,000 NTD x10000"), which the check scaled again: a cap
  # of 10^13 that never fired.
  max_notional: 1000000                 # 1,000,000 NTD per order
  per_symbol_max_notional: 1000000      # 1,000,000 NTD per order, per symbol
  max_position_lots: 1                  # Phase 3 Canary: 1 lot max
  # DEAD while an intraday_pnl block exists below, which it does. validators.py
  # uses `_hard_limit_threshold_scaled if _intraday_pnl_enabled else
  # _default_max_daily_loss`, so the operative hard stop is
  # intraday_pnl.hard_limit_ntd (15,000 NTD), not this 20,000. Change that key,
  # not this one. Kept only as the fallback for configs with no intraday block,
  # and above the operative cap so it stays a true upper bound.
  max_daily_loss: 200000000             # 20,000 NTD x10000 — fallback only
  max_price_cap: 5000.0                 # Stocks: max 5,000 NTD per share
  max_price_cap_futures: 50000.0        # Futures: max 50,000 NTD (covers TMFD6/TXFD6)
  max_price_cap_options: 10000.0        # TXO options: max 10,000 NTD
  # Per-ROOT overrides cover metadata-resolution gaps post-rollover
  # (2026-04-27 incident: TMFE6 absent from symbols.yaml -> product_type=""
  # -> fallback to global 5000 cap rejected real ~404M scaled futures price).
  # 500000.0 NTD raw = 5,000,000,000 scaled, ~11x headroom over TAIEX ~45,000 pts.
  #
  # Keyed on the product root, not the delivery month. These were previously
  # six month codes (TMFE6/TMFD6/TXFE6/TXFD6/MXFE6/MXFD6); every one of them
  # expired, so on 2026-08-10 the live TMFH6 matched nothing and fell through
  # to max_price_cap_futures = 50,000 with TAIEX at 45,033 — about 11% from
  # rejecting every order R47 sends. A root survives every roll.
  # Resolution order: max_price_cap_<SYMBOL> > root > product type > global.
  max_price_cap_root_TMF: 500000.0
  max_price_cap_root_TXF: 500000.0
  max_price_cap_root_MXF: 500000.0
  # The daily boundary is fixed at 05:00 Taipei in DailyLossLimitValidator; a
  # daily-loss stop is released only by `hft risk rearm daily_loss`.

# Per-strategy limits (conservative first-launch values). max_position_lots
# also bounds the order size: an opening order that would take the position
# past it is rejected.
strategies:
  CBS_TMF:
    max_position_lots: 1
  OPPORTUNISTIC_MM_TMF:
    max_position_lots: 1

intraday_pnl:
  scope: global
  # A loss is the trading day's net change (realized since 05:00 plus today's
  # share of unrealized). 2026-10-23: the 40%-of-peak rule (peak_drawdown_pct)
  # is removed -- it halted R47 on 10/22 with the day 1,270 NTD up -- and
  # StormGuard no longer reads PnL at all, so this block is the only loss stop.
  #
  # The hard limit sets halt_triggered -> StormGuard HALT, which stops new
  # orders. From the loss_exit block below, a latched stop with a position
  # open is also closed (FORCE_FLAT); before it the stop froze the book
  # (THESHOW 10/15-10/21: one TMFJ6 lot held to settlement).
  soft_limit_ntd: 500
  # 2026-10-23: real-money limits set by the user -- daily 15,000 NTD, one
  # position 5,000 NTD (position_loss_limit_ntd below). A hard-limit stop
  # writes a durable manual latch (risk/manual_latches.py): it survives the
  # 05:00 roll and a restart, and `hft risk rearm daily_loss` releases it.
  hard_limit_ntd: 15000
  soft_recovery_ntd: 300
  soft_limit_cooldown_s: 60
  # Since-entry loss on one position, across days, at which risk/loss_exit.py
  # closes it. The daily limits above judge only the day's change (a lot
  # carried overnight is measured from that day's opening mark), so this is
  # what bounds a loss carried across days. Set explicitly: it no longer
  # equals hard_limit_ntd.
  position_loss_limit_ntd: 5000

# On a monthly future's delivery date, from `cutoff` (Taipei), intents that
# would open or add to it are rejected and loss_exit closes what is left, so
# no position reaches the exchange's 13:30 final settlement.
expiry_guard:
  enabled: true
  cutoff: "13:00"

# Platform exit (risk/loss_exit.py): FORCE_FLAT, IOC, `protection_ticks`
# through the best opposite price, retried every `retry_interval_s` while the
# trigger holds. Triggers: the daily-loss stop latched with a position open,
# position_loss_limit_ntd reached, expiry_guard cutoff passed. `enabled: false`
# turns it off at the next SIGHUP risk-config reload.
loss_exit:
  enabled: true
  protection_ticks: 5
  retry_interval_s: 10
