# Production Risk Limits
# Loaded by RiskEngine when HFT_ENV=prod (via paths.strategy_limits override in prod/main.yaml).
#
# Source-of-truth for risk limit values: this file supersedes config/base/strategy_limits.yaml
# in production. Keep in sync with config/env/prod/risk.yaml (human-readable annotations).
#
# Mini-TAIEX: 1 point = 10 NTD. Prices use scaled int (x10000).

# global_limits mirrors global_defaults for human readability; RiskEngine reads global_defaults.
global_limits:
  max_position_lots: 1
  max_order_size: 1
  # daily_loss_limit: 8,000 NTD = 80,000,000 in scaled int (x10000)
  max_daily_loss: 80000000
  max_notional_per_symbol: 1000000000    # 100,000 NTD x10000
  max_total_notional: 1000000000         # 100,000 NTD x10000

# global_defaults is the key consumed by RiskEngine validators at runtime.
global_defaults:
  max_notional: 1000000000              # 100,000 NTD x10000
  per_symbol_max_notional: 1000000000   # 100,000 NTD x10000
  max_position_lots: 1                  # Phase 3 Canary: 1 lot max
  # DEAD while an intraday_pnl block exists below, which it does. validators.py
  # uses `_hard_limit_threshold_scaled if _intraday_pnl_enabled else
  # _default_max_daily_loss`, so the operative hard stop is
  # intraday_pnl.hard_limit_ntd (5,000 NTD), not this 8,000. Change that key,
  # not this one. Kept only as the fallback for configs with no intraday block.
  max_daily_loss: 80000000              # 8,000 NTD x10000 — fallback only
  max_price_cap: 5000.0                 # Stocks: max 5,000 NTD per share
  max_price_cap_futures: 50000.0        # Futures: max 50,000 NTD (covers TMFD6/TXFD6)
  max_price_cap_options: 10000.0        # TXO options: max 10,000 NTD
  # Per-ROOT overrides cover metadata-resolution gaps post-rollover
  # (2026-04-27 incident: TMFE6 absent from symbols.yaml -> product_type=""
  # -> fallback to global 5000 cap rejected real ~404M scaled futures price).
  # 500000.0 NTD raw = 5,000,000,000 scaled, ~11x headroom over TAIEX ~45,000 pts.
  #
  # Keyed on the product root, not the delivery month. These were previously
  # six month codes (TMFE6/TMFD6/TXFE6/TXFD6/MXFE6/MXFD6); every one of them
  # expired, so on 2026-08-10 the live TMFH6 matched nothing and fell through
  # to max_price_cap_futures = 50,000 with TAIEX at 45,033 — about 11% from
  # rejecting every order R47 sends. A root survives every roll.
  # Resolution order: max_price_cap_<SYMBOL> > root > product type > global.
  max_price_cap_root_TMF: 500000.0
  max_price_cap_root_TXF: 500000.0
  max_price_cap_root_MXF: 500000.0
  max_order_per_min: 10
  order_size_limit: 1
  daily_pnl_reset_hour: 5              # 05:00 local time (Taiwan)
  # NOT IMPLEMENTED — no code in src/ reads this key. It records an operator
  # intent that has never been enforced; grep before relying on it. What
  # actually governs release is per halt reason, in DailyLossLimitValidator:
  #   DAILY_LOSS_LIMIT  sticky, clears only at the daily_pnl_reset_hour roll
  #                     or an explicit _force_reset. Never auto-releases.
  #   PEAK_DRAWDOWN     auto-releases once PnL recovers to within
  #                     drawdown_recovery_pct of the peak, after
  #                     soft_limit_cooldown_s. See intraday_pnl below.
  # Wiring this key to gate the PEAK_DRAWDOWN release is a live option; at
  # `true` it would disable that release, so it needs a deliberate decision
  # rather than a silent default. Same defect class as drawdown_recovery_pct,
  # which sat here unread until PR #505.
  halt_requires_manual_recovery: true

# Per-strategy limits (conservative first-launch values)
strategies:
  CBS_TMF:
    max_position_lots: 1
    max_order_qty: 1
  OPPORTUNISTIC_MM_TMF:
    max_position_lots: 1
    max_order_qty: 1

intraday_pnl:
  scope: global
  # 2026-04-20: User-requested daily loss cap 5,000 NTD; PEAK_DRAWDOWN
  # only protects days with peak ≥ 3,500 NTD (40% retracement → trigger).
  #
  # PEAK_DRAWDOWN sets halt_triggered → StormGuard HALT, which STOPS NEW
  # ORDERS. It does NOT close the book. The original design called for
  # autonomy_monitor.flatten_all() to flatten at market, and this comment
  # asserted that it did, but AutonomyMonitor is only constructed when
  # HFT_AUTONOMY_MONITOR_ENABLED=1 and that is unset on THESHOW — flatten_all
  # has never run there. Enabling it means enabling autonomous market orders
  # and is a separate, deliberately watched change. Until then this stop
  # freezes the book; it does not flatten it.
  #
  # Recovery: drawdown_recovery_pct is the release threshold (halt at
  # peak_drawdown_pct, release at drawdown_recovery_pct — the gap is
  # deliberate hysteresis), gated by soft_limit_cooldown_s. Wired in PR #505;
  # before that it was read nowhere and the only exit was the daily roll.
  soft_limit_ntd: 500
  hard_limit_ntd: 5000
  peak_drawdown_pct: 0.40
  soft_recovery_ntd: 300
  drawdown_recovery_pct: 0.20
  soft_limit_cooldown_s: 60
  peak_drawdown_min_peak_ntd: 3500
