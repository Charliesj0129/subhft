# config/research/cost_profiles.yaml
# Per-instrument cost model for standardized backtest engine.
# Values in POINTS per side (not NTD).
#
# Index-futures transaction tax is 0.002% of notional on the BUYER AND the SELLER
# (rate in force since 2019-01-01), i.e. price x 0.00002 points per side, the same
# number of points for TXF, MXF and TMF. It is modelled at a 50,000-point reference
# (1.00 pt per side), above the current ~48.5k, so the default errs towards cost
# (0.97 pt at 48.5k, 0.45 pt at 22.5k). A fixed point count overstates the tax in
# low-index periods, which is the conservative direction for a cost gate.
#
# Commission is broker-specific and ASSUMED (not checked with the broker). The default
# profile takes the HIGH end of the range (NTD/side incl. exchange fee: TXF 30-100,
# MXF 15-50, TMF 8-20); `<ROOT>_mid` and `<ROOT>_low` are sensitivity variants only and
# must never be used to pass a gate that the default fails.
#
# Per side, default:  TXF 0.5 + 1.0 = 1.5 pt,  MXF 1.0 + 1.0 = 2.0 pt,  TMF 2.0 + 1.0 = 3.0 pt.
# Before 2026-10-06 this file charged TXF 1.5 (tax modelled as sell-only, averaged) and
# TMF 2.0 (tax 0.7 pt, commission 1.3 pt); the TMF figure understated cost by 1.0 pt per side.
#
# Lookup: an exact key wins; otherwise a contract-month code such as TMFJ6 falls back to
# its root key (TXF / MXF / TMF). See research/backtest/cost_models.py.
# Source: memory/feedback_taifex_fee_structure.md (corrected 2026-10-06).

TXF:
  commission_pts_per_side: 0.5
  tax_pts_per_side: 1.0
  point_value_nwd: 200
  scale: 1000000

