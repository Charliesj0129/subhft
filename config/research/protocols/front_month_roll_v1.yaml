# Pre-registered roll rule for a rolled front-month series (ADR-004, option A).
#
# A maker candidate whose manifest instrument is `<ROOT>_frontmonth` (for
# example `TMF_frontmonth`) is judged on one series that rolls across contract
# months by this rule. The sha256 of this file's bytes is recorded in every
# run's RunStamp (`protocol_sha256`), so a run can always be traced to the rule
# it used. Do not edit this file once a run has used it: write
# front_month_roll_v2.yaml instead. research/backtest/rolled_series.py
# implements the rule and refuses a protocol whose fields it does not
# implement.
#
# The rule matches what the live loop trades as `symbol_family: TMFR1`
# (config/loops/r47_tmf_v1.yaml): build_snapshot_from_calendar in
# src/hft_platform/contracts/family_resolver.py binds R1 to the earliest
# contract whose delivery date is on or after taifex_delivery_cutoff
# (src/hft_platform/core/market_calendar.py), which is today before 13:30
# exchange time and tomorrow from 13:30. A delivery day's night session
# therefore already trades the next month, and here it belongs to the next
# trading day, which quotes the next month.
schema: research_protocol.v1
id: front_month_roll_v1
kind: roll_rule

# Trading days are the exchange_calendars sessions of this calendar. An
# unavailable calendar, or a day outside its range, is an error, never a
# weekday guess.
calendar: XTAI
timezone: Asia/Taipei

# A trading day D covers [previous trading day 14:00, D 14:00) local time:
# the night session that opens after the previous day session, then D's day
# session. 14:00 falls in the gap between the day close (13:45) and the night
# open (15:00).
trading_day:
  night_session: next_trading_day
  window_start_local: "14:00"

# A monthly contract delivers on the third Wednesday of its month, or on the
# next trading day when that Wednesday is not one.
delivery_date: third_wednesday_next_trading_day

# Trading day D quotes the contract with the earliest delivery date on or
# after D. The code is <ROOT><month letter><last digit of year>, January = A.
quoted_contract: earliest_delivery_on_or_after_trading_day
month_codes: ABCDEFGHIJKL

# Each trading day runs on one contract and is marked at that day's last mid,
# so no position and no PnL cross a roll. The strategy is told the new
# contract (set_active_symbol, when it has one) before the first event of the
# first day on it.
roll_day_pnl: per_day_on_quoted_contract
