name: Canary Deploy

on:
  push:
    branches: [main]

jobs:
  canary-evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: ./.github/actions/setup-python-uv

      - name: Evaluate canary promotion
        run: |
          uv run python scripts/auto_release_orchestrator.py --project-root . --dry-run
