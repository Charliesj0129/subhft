name: Canary Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary-evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the dry-run logger from the project lock
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("uv.lock").read_text())["package"]
          (logger,) = [pkg for pkg in packages if pkg["name"] == "structlog"]
          hashes = " ".join("--hash=" + wheel["hash"] for wheel in logger["wheels"])
          requirement = f"structlog=={logger['version']} {hashes}"
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--require-hashes",
               "--only-binary=:all:", "--no-deps", "-r", "/dev/stdin"],
              input=requirement, text=True, check=True,
          )
          PYTHON

      - name: Evaluate canary promotion
        run: |
          python scripts/auto_release_orchestrator.py --project-root . --dry-run
