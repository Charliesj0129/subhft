version: 2

# Loop_v1 stabilization freeze allowlist (see
# docs/loop_v1_stabilization_charter.md). During the 30-trading-day clock,
# Dependabot is restricted to:
#   - Security advisories (handled by GitHub's Dependabot security alerts —
#     separate from the schedule below; major bumps in security branches
#     still land here for review).
#   - Patch and minor version bumps for non-runtime dev tooling.
# Major version bumps are explicitly ignored to prevent supply-chain or
# behavioural drift in the order/risk/recorder paths.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
      - freeze-allowed
    # `github/codeql-action/*` must move as one unit. The sub-actions are
    # published from a single repository and the action refuses to run `init`
    # and `analyze` at different versions, so a per-sub-action PR can never go
    # green on its own: #407 and #409 both sat red on `Analyze Python` for a
    # month for exactly that reason, and #422 had to bump all three by hand.
    # Dependabot re-created the split the same day (#426, #427), which is why
    # this is a config fix rather than another manual combined PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
      - freeze-allowed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # shioaji is pinned by CLAUDE.md and may not move without explicit
      # operator approval: 1.5.x replaced the SDK internals with a Rust `_core`
      # (see docs/runbooks/shioaji-version-diff.md) and every broker callback
      # payload type in feed_adapter/shioaji/ is written against that surface.
      # The semver-major rule above does not cover a new feature line — 1.5.6 ->
      # 1.7.2 is a *minor* bump — which is why #406 was opened and had to be
      # closed by hand. So minor and major are both ignored here.
      #
      # Patch bumps on the pinned line are deliberately NOT ignored. This entry
      # used to read `dependency-name: "shioaji"` with no update-types, which is
      # blunter than the reasoning above: it also suppressed same-minor fix
      # releases, and those are exactly what a stabilization freeze wants to
      # still let through. 1.5.7 ("recover exhausted Solace sessions", released
      # 2026-08-13) went unannounced for two weeks because of it.
      #
      # A patch PR is safe to *receive* because it cannot land silently:
      # tests/unit/feed_adapter/shioaji/test_sdk_surface_golden.py compares the
      # installed SDK surface against its committed golden, so any bump turns
      # the unit job red until someone runs `make shioaji-surface-regen` and
      # reviews `make shioaji-diff`. The PR is the notification; the guard is
      # what makes it a decision rather than a merge.
      #
      # Releases on other lines are surfaced by `make shioaji-watch` instead
      # (scripts/shioaji_api_diff/watch.py), which reads PyPI directly and is
      # not affected by anything in this file.
      #
      # Security advisories still reach us through Dependabot alerts, which
      # this list does not suppress.
      - dependency-name: "shioaji"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # --- Added with the reproducible image build -------------------------------
  # The deployed Python set is derived from uv.lock at image build time
  # (`uv export --locked`), so the `pip` entry above, which already opens
  # uv.lock PRs, is the one place Python runtime versions move.
  #
  # maturin and uv run only inside the image build. Hash-pinned in their own
  # directory.
  - package-ecosystem: pip
    directory: /docker/build
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - python
      - freeze-allowed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Base-image digest + tag in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
      - freeze-allowed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Third-party images in the compose files (prometheus, loki, redis, ...).
  # Major bumps are ignored: they change on-disk formats and config schemas.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
      - freeze-allowed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Rust crates (Cargo.lock at the repo root).
  # pyo3 and numpy are the Python<->Rust FFI boundary of the hot path: a 0.x
  # minor bump there is a breaking change and needs its own benchmarked PR, so
  # only patch releases are proposed here. Security advisories against them
  # still arrive as Dependabot security PRs, which this list does not suppress.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - rust
      - freeze-allowed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pyo3"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
