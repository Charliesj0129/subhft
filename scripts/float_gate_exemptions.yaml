# Float gate exemptions (scripts/check_float_in_financial_paths.py).
#
# The gate flags `: float` annotations and `float(` calls in order/, risk/, execution/ and
# feed_adapter/normalizer.py (Law 4: prices and accounting values are scaled int x10000). A line passes
# only if it is listed here (file + exact code text, comments ignored, `count` lines at most) or carries
# `# precision-ok: <reason>` with a non-empty reason. An entry that matches nothing fails the gate, so
# this file cannot go stale silently; a new float line fails until someone writes down why it is fine.
#
# kind:
#   not-money            duration, timestamp, dimensionless score; no currency unit
#   offline-only         code no live path imports
#   boundary-conversion  a float from the broker or a config file is converted to an integer right here
