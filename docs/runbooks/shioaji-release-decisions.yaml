# Shioaji upgrade decisions
# =========================
#
# One entry per published release newer than the pin. `make shioaji-watch`
# reads this file and fails when a release has no decision here, or when a
# deferral's `revisit_after` has passed. Capturing an API surface is evidence,
# not a decision -- without this file the weekly watcher goes quiet the moment
# somebody runs the capture command, which is not the same as somebody having
# made a call.
#
# `pin` must equal the `shioaji==` requirement in pyproject.toml. Every verdict
# below was reached relative to that pin, so if the pin moves, all of them are
# void and this file has to be rewritten against the new one.
#
# Verdicts (scripts/shioaji_api_diff/decisions.py enforces every rule here):
#   ADOPT    move the pin. Refused if the evidence diff names any change to a
#            symbol the platform actually uses.
#   DEFER    not now. MUST carry `revisit_after` -- a deferral with no expiry
#            is indistinguishable from having forgotten.
#   BLOCKED  the evidence diff names a platform-breaking change. MUST list the
#            `blocking_symbols`, and each must appear in that diff.
#
# `evidence` must be the pin-to-candidate diff (diff_<pin>_to_<version>.json).
# Consecutive hops do not describe the upgrade anyone would actually perform:
# 1.7.2 -> 1.7.3 is SAFE on its own while 1.5.6 -> 1.7.3 is BLOCKED.
#
# Regenerate a missing diff from the committed surfaces (no network, no login):
#   uv run python -m scripts.shioaji_api_diff diff --from 1.5.6 --to <version> \
#     > tests/golden/shioaji_sdk/diff_1.5.6_to_<version>.json

pin: "1.7.9"

# 2026-10-22: pin moved 1.5.6 -> 1.7.9 at the owner's request. 1.5.6 had been
# deleted from PyPI, so the lock could no longer be re-resolved and the image
# could not be rebuilt. The three platform breaks the 1.5.6-pinned ledger
# recorded for every 1.7.x release (SecurityType.Future -> Futures; login()
# lost contracts_timeout and fetch_contract) are remediated in the adapter;
# git history holds the superseded 1.5.6-relative entries. No release newer
# than 1.7.9 exists yet.
decisions: []
